# 1. 基础路径设置：本地预览建议用 "/"
baseurl = "/"
locale  = "zh-cn"
title   = "北辰的个人博客"

# 2. 核心语言切换
# 这会调用主题内部的 i18n/zh-cn.yaml，翻译掉“Archives”、“Tags”等系统词汇
defaultContentLanguage = "zh-cn"

# 3. 开启中日韩语言支持
# 非常重要！不开启的话，你的文章摘要（Summary）会按空格切分单词，导致中文摘要显示不全
hasCJKLanguage = true

# 4. 自定义 SCSS 配置 - 启用思源宋体国内镜像
# 自动加载 assets/scss/custom.scss 中的自定义样式
[params]
    # customSCSS 参数指定自定义样式文件（Hugo Theme Stack 自动识别）
    customSCSS = ["scss/custom"]

# 5. 其他建议修改
disqusShortname = "" # 如果不用评论系统，先留空

[pagination]
    pagerSize = 5
